<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isotope lab correction</title>
    <script src="./shinylive/load-shinylive-sw.js" type="module"></script>
    <script type="module">
      import { runApp } from "./shinylive/shinylive.js";
      const response = await fetch("./app.json");
      if (!response.ok) throw new Error("HTTP error loading app.json: " + response.status);
      const appFiles = await response.json();
      runApp(document.getElementById("root"), "viewer", {
        startFiles: appFiles,
        viewerHeight: "100%"
      }, "r");
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      #root {
        height: 100%;
        width: 100%;
      }
      #root .shinylive-container,
      #root .shinylive-container.viewer,
      #root .shinylive-viewer,
      #root iframe.app-frame {
        height: 100% !important;
        min-height: 100% !important;
        width: 100% !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
