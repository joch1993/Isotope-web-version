<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Isotope lab correction</title>
    <script src="./shinylive/load-shinylive-sw.js?v=40" type="module"></script>
    <script type="module">
      import { runApp } from "./shinylive/shinylive.js";
      const response = await fetch("./app.json?v=" + Date.now(), { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP error loading app.json: " + response.status);
      const appFiles = await response.json();
      runApp(document.getElementById("root"), "viewer", {
        startFiles: appFiles,
        viewerHeight: "100%"
      }, "r");
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      #root { height: 100%; width: 100%; }
      #page-howto-bar, #page-howto-btn, #page-howto-panel { display: none !important; }
      #root .shinylive-container,
      #root .shinylive-container.viewer,
      #root .shinylive-viewer,
      #root iframe.app-frame {
        height: 100% !important;
        min-height: 100% !important;
        width: 100% !important;
      }
      #iso-guide-host {
        position: fixed; inset: 0; z-index: 2147483000; pointer-events: none;
      }
      #iso-guide-host .iso-guide-overlay {
        position: fixed !important; inset: 0 !important; pointer-events: none;
      }
      #iso-guide-host .iso-guide-card {
        position: fixed !important; pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="iso-guide-host"></div>
    <div id="iso-build-stamp" style="position:fixed;right:8px;bottom:6px;z-index:9999;font:11px/1.2 sans-serif;color:#888;pointer-events:none;">v69</div>
  </body>
</html>
