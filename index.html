<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Isotope lab correction</title>
    <script>
      (function () {
        var bar = document.getElementById("page-howto-bar");
        if (bar) bar.remove();
        var btn = document.getElementById("page-howto-btn");
        if (btn) btn.remove();
        var panel = document.getElementById("page-howto-panel");
        if (panel) panel.remove();
        if (window.caches) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          });
        }
        if (navigator.serviceWorker) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.update(); });
          });
        }
      })();
    </script>
    <script src="./shinylive/load-shinylive-sw.js?v=21" type="module"></script>
    <script type="module">
      import { runApp } from "./shinylive/shinylive.js";
      const response = await fetch("./app.json?v=" + Date.now(), { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP error loading app.json: " + response.status);
      const appFiles = await response.json();
      runApp(document.getElementById("root"), "viewer", {
        startFiles: appFiles,
        viewerHeight: "100%"
      }, "r");
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      #root { height: 100%; width: 100%; }
      #page-howto-bar, #page-howto-btn, #page-howto-panel { display: none !important; }
      #root .shinylive-container,
      #root .shinylive-container.viewer,
      #root .shinylive-viewer,
      #root iframe.app-frame {
        height: 100% !important;
        min-height: 100% !important;
        width: 100% !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
